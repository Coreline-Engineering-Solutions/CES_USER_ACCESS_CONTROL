<aside class="sidebar" [class.collapsed]="layout.sidebarCollapsed()">
  <div class="sidebar-toolbar">
    @if (!layout.sidebarCollapsed()) {
      <div class="brand">
        <img src="/assets/CESLogoWhite.png" alt="CES" class="brand-logo" />
        <span class="brand-name">Access Control</span>
      </div>
    }

    <button
      type="button"
      class="collapse-toggle"
      (click)="layout.toggleSidebar()"
      [title]="layout.sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!layout.sidebarCollapsed()"
      aria-label="Toggle sidebar"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        @if (layout.sidebarCollapsed()) {
          <path d="M9 18l6-6-6-6"/>
        } @else {
          <path d="M15 18l-6-6 6-6"/>
        }
      </svg>
    </button>
  </div>

  <nav class="sidebar-body">
    @if (!layout.sidebarCollapsed()) {
      <h2 class="nav-group-label">Navigation</h2>
    }

    @for (item of items; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        [title]="layout.sidebarCollapsed() ? item.label : ''"
      >
        <span class="nav-icon">
          @switch (item.icon) {
            @case ('dashboard') {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="9" rx="1"/>
                <rect x="14" y="3" width="7" height="5" rx="1"/>
                <rect x="14" y="12" width="7" height="9" rx="1"/>
                <rect x="3" y="16" width="7" height="5" rx="1"/>
              </svg>
            }
            @case ('access') {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            }
          }
        </span>
        @if (!layout.sidebarCollapsed()) {
          <span class="nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>
</aside>
